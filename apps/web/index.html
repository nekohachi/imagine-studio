<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1b1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Imagine Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1b1f;
        --fg: #e8e8ec;
        --dim: #9a9aa6;
        --panel: rgba(28, 28, 34, 0.9);
        --line: rgba(255, 255, 255, 0.12);
        --accent: #4f9fd1;
        --accent-dim: #2f5f7d;
        --top-h: 52px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #overlay rect,
      #overlay path {
        fill: rgba(79, 159, 209, 0.15);
        stroke: #4f9fd1;
        stroke-width: 1.5;
        stroke-dasharray: 6 4;
      }
      #overlay .tbox {
        fill: none;
        stroke: #4f9fd1;
        stroke-width: 1.5;
        stroke-dasharray: none;
      }
      #overlay .handle {
        fill: #fff;
        stroke: #4f9fd1;
        stroke-width: 2;
        stroke-dasharray: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #ui > * {
        pointer-events: auto;
      }
      #ui.ui-hidden > :not(#toast) {
        display: none;
      }

      /* 上バー(Procreate 配置) */
      #top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: calc(var(--sat) + 6px) 8px 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(180deg, rgba(27, 27, 31, 0.92), rgba(27, 27, 31, 0.6) 80%, transparent);
        pointer-events: none;
      }
      #top .group {
        display: flex;
        gap: 4px;
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 3px;
        backdrop-filter: blur(8px);
      }
      .ibtn {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        min-width: 44px;
        height: 44px;
        padding: 0 6px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #c8ced6;
        touch-action: none;
      }
      .ibtn-label {
        font-size: 9px;
        line-height: 1;
        color: var(--dim);
      }
      .ibtn.open,
      .ibtn.on {
        background: rgba(79, 159, 209, 0.18);
        color: #fff;
      }
      .ibtn.on .ibtn-label {
        color: var(--accent);
      }
      .ibtn:disabled {
        opacity: 0.35;
      }
      .ibtn.swatch {
        min-width: 44px;
      }
      .swatch-main {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #000;
      }
      .swatch-sub {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid #fff;
        box-shadow: 0 0 0 1px #000;
      }

      /* 左レール */
      #rail {
        position: absolute;
        left: 8px;
        top: calc(var(--sat) + var(--top-h) + 16px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 8px 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        backdrop-filter: blur(8px);
      }
      .rail-btn {
        min-width: 40px;
        height: 40px;
      }
      .rail-btn .ibtn-label {
        display: none;
      }

      /* 修飾ボタン(左下) */
      #mods {
        position: absolute;
        left: 8px;
        bottom: calc(var(--sab) + 8px);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mod-row {
        display: flex;
        gap: 6px;
      }
      .mod-row.right {
        justify-content: flex-end;
      }

      /* パネル */
      #panel {
        position: absolute;
        right: 8px;
        top: calc(var(--sat) + var(--top-h) + 10px);
        width: min(360px, calc(100vw - 16px));
        max-height: calc(100vh - var(--sat) - var(--top-h) - var(--sab) - 24px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        overflow: hidden;
        display: flex;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      #panel.left {
        right: auto;
        left: 8px;
      }
      #panel[hidden],
      #hud[hidden],
      #toast[hidden] {
        display: none;
      }
      #panelBody {
        padding: 10px 12px 14px;
        overflow: auto;
        width: 100%;
        -webkit-overflow-scrolling: touch;
      }
      @media (max-width: 700px) {
        #panel,
        #panel.left {
          left: 0;
          right: 0;
          top: auto;
          bottom: 0;
          width: 100%;
          max-height: 60vh;
          border-radius: 14px 14px 0 0;
        }
        .ibtn-label {
          display: none;
        }
        .ibtn {
          min-width: 40px;
          height: 40px;
        }
      }
      .ptitle {
        font-size: 11px;
        color: var(--dim);
        margin: 10px 0 6px;
        letter-spacing: 0.04em;
      }
      .ptitle:first-child {
        margin-top: 0;
      }
      .prow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .pbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
      }
      .pbtn.icon-only {
        padding: 0 8px;
      }
      .pbtn:active {
        background: rgba(255, 255, 255, 0.16);
      }
      .ptoggle,
      .pslider {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        color: var(--fg);
      }
      .pslider input[type="range"] {
        flex: 1;
        min-width: 100px;
      }
      .pslider span {
        min-width: 36px;
        text-align: right;
        font-family: ui-monospace, Menlo, monospace;
        color: var(--dim);
      }
      .plist {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .prow-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.04);
        text-align: left;
        touch-action: none;
      }
      .prow-btn.on {
        border-color: var(--accent);
        background: rgba(79, 159, 209, 0.16);
      }
      .pfav {
        color: #555;
      }
      .pfav.on {
        color: #f1c40f;
      }
      .pjson summary {
        cursor: pointer;
        color: var(--dim);
        margin: 10px 0 6px;
      }
      .pjson textarea {
        width: 100%;
        height: 240px;
        box-sizing: border-box;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        background: rgba(0, 0, 0, 0.3);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        -webkit-user-select: text;
        user-select: text;
      }
      .phelp {
        color: var(--dim);
        font-size: 12px;
        line-height: 1.6;
      }

      /* レイヤー */
      .lylist {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lyrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.04);
        touch-action: none;
      }
      .lyrow.on {
        border-color: var(--accent);
        background: rgba(79, 159, 209, 0.16);
      }
      .lyrow.off {
        opacity: 0.5;
      }
      .lythumb {
        width: 56px;
        height: 56px;
        border-radius: 6px;
        background: #fff;
        flex: 0 0 auto;
      }
      .lyname {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .lysub {
        font-size: 10px;
        color: var(--dim);
      }
      .lyeye {
        width: 36px;
        height: 36px;
        border: 0;
        background: transparent;
        color: var(--dim);
        border-radius: 8px;
      }

      /* カラー */
      .cpick {
        display: flex;
        gap: 10px;
        height: 180px;
      }
      .cpick-sv {
        flex: 1;
        position: relative;
        border-radius: 8px;
        touch-action: none;
      }
      .cpick-hue {
        width: 22px;
        position: relative;
        border-radius: 8px;
        touch-action: none;
        background: linear-gradient(to bottom, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
      }
      .cpick-knob {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #000;
        pointer-events: none;
      }
      .cpick-hue .cpick-knob {
        left: 50%;
      }
      .cswatches {
        margin-top: 10px;
      }
      .cbig {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .chex {
        flex: 1;
        min-width: 90px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.3);
        color: var(--fg);
        font: 13px ui-monospace, Menlo, monospace;
        padding: 0 8px;
        -webkit-user-select: text;
        user-select: text;
      }
      .cgrid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
      }
      .ccell {
        aspect-ratio: 1;
        border-radius: 7px;
        border: 1px solid var(--line);
      }

      /* HUD、トースト、エラー */
      #hud {
        position: fixed;
        top: calc(var(--sat) + var(--top-h) + 10px);
        right: 8px;
        padding: 6px 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        white-space: pre;
        pointer-events: none;
        color: var(--dim);
        z-index: 5;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--sab) + 70px);
        transform: translateX(-50%);
        padding: 8px 14px;
        background: rgba(20, 20, 26, 0.92);
        border: 1px solid var(--line);
        border-radius: 10px;
        pointer-events: none;
        z-index: 70;
      }
      #err {
        position: fixed;
        left: 8px;
        top: calc(var(--sat) + var(--top-h) + 10px);
        padding: 8px 10px;
        background: #4a1f1f;
        border-radius: 8px;
        display: none;
        white-space: pre-wrap;
        max-width: 80vw;
        z-index: 80;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <svg id="overlay" aria-hidden="true"></svg>
    <div id="ui"></div>
    <div id="hud" hidden></div>
    <div id="err"></div>
    <input id="file" type="file" accept=".imst,application/zip" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
